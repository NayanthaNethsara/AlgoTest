[package]
name = "mini-algothon-competitor"
version = "0.2.0"
description = "MiniAlgothon competitor client: proctor agent and contest shell"
authors = ["MiniAlgothon"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mini-algothon-competitor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.11", features = ["json", "blocking"] }
sysinfo = "0.30"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
tiny_http = "0.12"
machine-uid = "0.6"
local-ip-address = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_UI_WindowsAndMessaging",
	"Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.dev]
debug = 0
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
