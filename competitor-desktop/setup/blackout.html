<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MiniAlgothon — Display Restricted</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #0c0d10;
        color: #f3f4f6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        cursor: not-allowed;
      }
      .lockout-card {
        max-width: 520px;
        text-align: center;
        background: #15181e;
        border: 3px solid #ef4444;
        box-shadow: 8px 8px 0px #000;
        padding: 36px 32px;
      }
      .lockout-badge {
        display: inline-block;
        background: #ef4444;
        color: #fff;
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 4px 12px;
        margin-bottom: 20px;
        border: 2px solid #000;
      }
      .lockout-title {
        font-size: 22px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        margin: 0 0 12px 0;
        color: #fff;
      }
      .lockout-desc {
        font-size: 13px;
        line-height: 1.6;
        color: #9ca3af;
        margin: 0 0 20px 0;
      }
      .lockout-footer {
        font-size: 11px;
        color: #ef4444;
        border-top: 1px solid #282c35;
        padding-top: 16px;
        margin-top: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <div class="lockout-card">
      <div class="lockout-badge">Lockdown Active</div>
      <h1 class="lockout-title">Multiple Displays Restricted</h1>
      <p class="lockout-desc">
        External and secondary monitors are restricted during competition. MiniAlgothon contest shell is active exclusively on your primary display.
      </p>
      <div class="lockout-footer" style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <span>Please disconnect this secondary display to continue.</span>
        <button id="btn-exit" style="background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.5); padding: 5px 12px; font-weight: 700; font-size: 11px; cursor: pointer; text-transform: uppercase;">
          Exit Client
        </button>
      </div>
    </div>
    <script>
      document.addEventListener("keydown", function (e) {
        e.preventDefault();
        e.stopPropagation();
      }, true);
      document.addEventListener("dragstart", function (e) {
        e.preventDefault();
      }, true);
      document.getElementById("btn-exit")?.addEventListener("click", function () {
        if (!confirm("Are you sure you want to exit? Exiting will terminate your tournament proctoring session and close the desktop client.")) {
          return;
        }
        var ports = [47615, 47616, 47617, 47618, 47619];
        for (var i = 0; i < ports.length; i++) {
          try {
            fetch("http://127.0.0.1:" + ports[i] + "/exit-competition", { method: "POST", mode: "no-cors" }).catch(function () {});
          } catch(e) {}
        }
      });

    </script>
  </body>
</html>
