<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MiniAlgothon — Display Restricted</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #0c0d10;
        color: #f3f4f6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        cursor: not-allowed;
      }
      .lockout-card {
        max-width: 520px;
        text-align: center;
        background: #15181e;
        border: 3px solid #ef4444;
        box-shadow: 8px 8px 0px #000;
        padding: 36px 32px;
      }
      .lockout-badge {
        display: inline-block;
        background: #ef4444;
        color: #fff;
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 4px 12px;
        margin-bottom: 20px;
        border: 2px solid #000;
      }
      .lockout-title {
        font-size: 22px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        margin: 0 0 12px 0;
        color: #fff;
      }
      .lockout-desc {
        font-size: 13px;
        line-height: 1.6;
        color: #9ca3af;
        margin: 0 0 20px 0;
      }
      .lockout-footer {
        font-size: 11px;
        color: #ef4444;
        border-top: 1px solid #282c35;
        padding-top: 16px;
        margin-top: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <div class="lockout-card">
      <div class="lockout-badge">Lockdown Active</div>
      <h1 class="lockout-title">Multiple Displays Restricted</h1>
      <p class="lockout-desc">
        External and secondary monitors are restricted during competition. MiniAlgothon contest shell is active exclusively on your primary display.
      </p>
      <div class="lockout-footer">
        Please disconnect this secondary display or video cable to continue.
      </div>
    </div>
    <script>
      document.addEventListener("keydown", function (e) {
        e.preventDefault();
        e.stopPropagation();
      }, true);
      document.addEventListener("dragstart", function (e) {
        e.preventDefault();
      }, true);
    </script>
  </body>
</html>
