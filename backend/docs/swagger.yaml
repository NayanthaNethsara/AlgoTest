host: localhost:8080
info:
  contact: {}
  description: Algorithmic contest platform REST API & judge engine.
  title: Labyrithm API
  version: "1.0"
paths:
  /api/v1/admin/audit-logs:
    get:
      description: Fetch paginated administrative and security audit events.
      parameters:
        - description: Max logs to return (default 50, max 200)
          in: query
          name: limit
          type: integer
        - description: Offset for pagination
          in: query
          name: offset
          type: integer
        - description: Filter by action type
          in: query
          name: action
          type: string
        - description: Filter by status (success, failure, locked, blocked)
          in: query
          name: status
          type: string
        - description: Filter by actor username
          in: query
          name: actorUsername
          type: string
        - description: Filter by target resource type
          in: query
          name: targetType
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: List Audit Logs
      tags:
        - Admin
  /api/v1/admin/contest/end:
    post:
      description: Immediately terminate the contest and set status to ENDED.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/contest.ContestState"
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Admin End Contest
      tags:
        - Admin Contest
  /api/v1/admin/contest/extend:
    post:
      consumes:
        - application/json
      description: Add additional minutes to the active contest duration.
      parameters:
        - description: Extend contest payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/api.extendContestRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/contest.ContestState"
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Admin Extend Contest Duration
      tags:
        - Admin Contest
  /api/v1/admin/contest/freeze:
    post:
      description: Manually freeze the leaderboard standings at the current moment.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/contest.ContestState"
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Admin Freeze Contest Scoreboard
      tags:
        - Admin Contest
  /api/v1/admin/contest/pause:
    post:
      description: Pause the active contest timer.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/contest.ContestState"
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Admin Pause Contest
      tags:
