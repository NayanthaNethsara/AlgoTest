    post:
      consumes:
        - application/json
      description:
        Ingest client-side browser proctoring violations (e.g. fullscreen
        exits, window blur, tab switch, devtools attempt).
      produces:
        - application/json
      responses: {}
      security:
        - BearerAuth: []
      summary: Record Browser Violation Telemetry Event
      tags:
        - Telemetry
  /api/v1/telemetry/leave-contest:
    post:
      description:
        Contestant voluntarily leaves the competition session. This revokes
        active agent enrollment and locks submission access until re-admitted by an
        admin.
      produces:
        - application/json
      responses: {}
      security:
        - BearerAuth: []
      summary: Voluntary Contest Leave
      tags:
        - Telemetry
  /api/v1/telemetry/self:
    get:
      description:
        Report the contestant's own agent liveness so the portal can warn
        them while they still have time to fix it. Recording the caller's browser
        presence is a side effect of the poll.
      parameters:
        - description: Whether the portal tab was foregrounded when polled
          in: query
          name: tab_visible
          type: boolean
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Self Proctor Status
      tags:
        - Telemetry
