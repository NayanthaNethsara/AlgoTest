user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Exempt internal Docker networks and loopback from edge rate limits
    geo $rate_limit_exempt {
        default 0;
        127.0.0.1 1;
        172.16.0.0/12 1;
        10.0.0.0/8 1;
        192.168.0.0/16 1;
    }

    map $rate_limit_exempt $limit_key {
        0 $binary_remote_addr;
        1 "";
    }

    # Edge rate limit zones (requests with empty key are not rate limited)
    limit_req_zone $limit_key zone=api_auth_limit:10m rate=5r/s;
    limit_req_zone $limit_key zone=api_general_limit:10m rate=30r/s;
    limit_conn_zone $limit_key zone=api_conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # 1. Server-Sent Events (SSE) Live Submissions Stream
        location /api/v1/submissions/stream {
            limit_conn api_conn_limit 10;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE streaming buffer flags
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Strict rate limit for authentication
        location /api/v1/auth/ {
            limit_req zone=api_auth_limit burst=10 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 2m;
        }

        # 3. Go Backend API Handlers
        location /api/ {
            limit_req zone=api_general_limit burst=40 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 32m;
        }


        # 3. Next.js Competitor Portal UI
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
