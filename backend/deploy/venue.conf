# Portal on the contest LAN, backend wherever contest_api points. Loaded into the
# nginx image's conf.d, so the image's own nginx.conf supplies http{} and defaults.
#
# One origin for portal and API is required, not cosmetic: the portal opens the
# live submission feed at the relative path /api/v1/submissions/stream.

# CHANGEME: the backend. keepalive because re-opening a connection per request
# over the venue uplink is what makes the portal feel remote.
upstream contest_api {
    server 35.192.22.76:80;
    keepalive 32;
}

upstream portal {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/venue-locations.conf;
}
