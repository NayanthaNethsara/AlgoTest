# The API host: TLS in front of the backend container. Used by
# docker-compose.prod.yml. Both portals talk to this origin.

upstream contest_api {
    server backend:8080;
    keepalive 32;
}

# Exempt internal Docker networks and loopback from edge rate limits
geo $rate_limit_exempt {
    default 0;
    127.0.0.1 1;
    172.16.0.0/12 1;
    10.0.0.0/8 1;
    192.168.0.0/16 1;
}

map $rate_limit_exempt $limit_key {
    0 $binary_remote_addr;
    1 "";
}

# Edge rate limit zones (requests with empty key are not rate limited)
limit_req_zone $limit_key zone=api_auth_limit:10m rate=5r/s;
limit_req_zone $limit_key zone=api_general_limit:10m rate=30r/s;
limit_conn_zone $limit_key zone=api_conn_limit:10m;

limit_req_status 429;
limit_conn_status 429;


server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mini-algothon-api.nayantha.me;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mini-algothon-api.nayantha.me;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 32m;

    include /etc/nginx/common-locations.conf;
    include /etc/nginx/api-locations.conf;
}
