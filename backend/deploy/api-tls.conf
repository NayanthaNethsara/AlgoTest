# The API host: TLS in front of the backend container. Used by
# docker-compose.prod.yml. Both portals talk to this origin.

upstream contest_api {
    server backend:8080;
    keepalive 32;
}

# Only trust CF-Connecting-IP when the TCP peer is genuinely Cloudflare's edge network
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Exempt internal Docker network (Next.js server-side calls) from edge rate limits
geo $remote_addr $is_internal_network {
    default 0;
    127.0.0.1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

map $is_internal_network $rate_limit_key {
    0 $binary_remote_addr;
    1 "";
}

# Edge rate limits: calibrated to allow multi-contestant shared IPs (schools/labs/NAT)
# while blocking volumetric DDoS and script floods.
limit_req_zone $rate_limit_key zone=api_auth_limit:10m rate=20r/s;
limit_req_zone $rate_limit_key zone=api_general_limit:10m rate=100r/s;
limit_conn_zone $rate_limit_key zone=api_conn_limit:10m;

limit_req_status 429;
limit_conn_status 429;





server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mini-algothon-api.nayantha.me;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mini-algothon-api.nayantha.me;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64m;

    include /etc/nginx/common-locations.conf;
    include /etc/nginx/api-locations.conf;
}
