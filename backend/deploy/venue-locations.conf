# Routing shared by venue.conf and venue-tls.conf. Included inside a server block.

gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript;

# Security & Anti-Crawler Headers
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Block Automated Vulnerability Scanners, AI Crawlers, and SEO Bots
if ($http_user_agent ~* (sqlmap|nikto|zgrab|nmap|masscan|dirbuster|gobuster|wpscan|semrushbot|dotbot|ahrefsbot|mj12bot|bytespider|gptbot|ccbot|petalbot|dataforseobot)) {
    return 403;
}

# Tell all search engines and compliant crawlers to ignore this domain
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

# Live SSE streaming without buffering
location /api/v1/submissions/stream {
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    chunked_transfer_encoding off;
}

# Standard API endpoints
location /api/ {
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    client_max_body_size 5m;
}

# Health check & Swagger documentation endpoints
location /healthz {
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location /swagger/ {
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Root fallback to backend API
location / {
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
