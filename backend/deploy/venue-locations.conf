# Routing shared by venue.conf and venue-tls.conf. Included inside a server block.
#
# proxy_pass below speaks HTTP to contest_api. Once the backend VM has TLS, move
# its upstream to :443 and change both API lines to:
#     proxy_pass https://contest_api;
#     proxy_ssl_server_name on;
#     proxy_set_header Host <the VM's certificate name>;
# Leaving the scheme at http:// against a :443 upstream is a 502, not a warning.

gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript;

# Separate location: these buffering flags are what make verdicts appear as they
# land instead of in a lump.
location /api/v1/submissions/stream {
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    chunked_transfer_encoding off;
}

location /api/ {
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    client_max_body_size 5m;
}

location / {
    proxy_pass http://portal;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
