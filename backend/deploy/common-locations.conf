# Policy shared by every deployment. Included inside a server block, before the
# routing specific to that deployment.

gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript;

add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Block Automated Vulnerability Scanners, AI Crawlers, and SEO Bots
if ($http_user_agent ~* (sqlmap|nikto|zgrab|nmap|masscan|dirbuster|gobuster|wpscan|semrushbot|dotbot|ahrefsbot|mj12bot|bytespider|gptbot|ccbot|petalbot|dataforseobot)) {
    return 403;
}

location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

# Prometheus scrapes the backend container directly on the compose network, so it
# never passes through here.
location = /metrics {
    deny all;
    return 404;
}

# Also disabled in the backend when ENV=production; this is the outer lock.
location /swagger/ {
    deny all;
    return 404;
}
