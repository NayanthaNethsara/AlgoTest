# Routing for the machine that runs the backend. No portal here, so the root falls
# through to the API. Included inside a server block, after common-locations.conf.

location /api/v1/submissions/stream {
    # SSE stream bypasses request rate limits; bounded by concurrent connections per IP
    limit_conn api_conn_limit 10;
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Strict edge rate limit for authentication (protects against password brute-force and hash DoS)
location /api/v1/auth/ {
    limit_req zone=api_auth_limit burst=10 nodelay;
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    client_max_body_size 2m;
}

location /api/ {
    limit_req zone=api_general_limit burst=40 nodelay;
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    client_max_body_size 32m;
}

location /healthz {
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    access_log off;
}

location / {
    limit_req zone=api_general_limit burst=40 nodelay;
    proxy_pass http://contest_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32m;
}

