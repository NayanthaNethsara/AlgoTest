# venue.conf with TLS, so COOKIE_SECURE can be true. Used by
# docker-compose.venue-tls.yml, which mounts ./certs.
#
# This covers the contestant-to-here hop only. Here-to-backend is a separate
# decision, made by the upstream below and the proxy_pass scheme in
# venue-locations.conf; TLS here does not encrypt it.
#
# CHANGEME: server_name in both blocks, and the contest_api upstream.

upstream contest_api {
    server 35.192.22.76:80;
    keepalive 32;
}

upstream portal {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name contest.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name contest.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/venue-locations.conf;
}
