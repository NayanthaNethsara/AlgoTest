# Portal on this machine, backend wherever API_URL points, served to the contest
# LAN on port 80. Settings come from .env -- see .env.example. `make venue` wraps
# this; `make venue-tls` adds docker-compose.venue-tls.yml on top.
#
# nginx is not optional: the portal opens the live submission feed at the relative
# path /api/v1/submissions/stream, so publishing the Next container alone gives a
# working portal whose results never arrive.

# Its own project, so `down` here never touches the dev stack in docker-compose.yml.
name: algothon-venue

services:
  frontend:
    build:
      context: .
      dockerfile: competitor-frontend/Dockerfile
    container_name: algothon-frontend
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:?set it in .env (see .env.example) or pass it to make venue}
      COOKIE_SECURE: "false"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    expose:
      - "3000"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: algothon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    environment:
      API_HOST: ${API_HOST:?set it in .env, e.g. mini-algothon-api.nayantha.me}
      API_PORT: ${API_PORT:-443}
      API_SCHEME: ${API_SCHEME:-https}
    volumes:
      - ./backend/deploy/templates/portal.conf.template:/etc/nginx/templates/portal.conf.template:ro
      - ./backend/deploy/templates/portal-locations.inc.template:/etc/nginx/templates/portal-locations.inc.template:ro
      - ./backend/deploy/common-locations.conf:/etc/nginx/common-locations.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
