name: algothon-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: algothon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algothon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algothon_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-algothon}
    volumes:
      - algothon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algothon} -d ${POSTGRES_DB:-algothon}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - algothon-net

  backend:
    image: ghcr.io/nayanthanethsara/algotest/backend:latest
    container_name: algothon-backend
    privileged: true
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - /var/local/lib/algothon-work:/var/local/lib/algothon-work
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - algothon-net

  nginx:
    image: nginx:1.27-alpine
    container_name: algothon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/deploy/venue-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/deploy/venue-locations.conf:/etc/nginx/venue-locations.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - algothon-net

networks:
  algothon-net:
    driver: bridge

volumes:
  algothon-pgdata:
    name: algothon-pgdata
