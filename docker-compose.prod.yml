name: labyrithm-prod

services:
  backend:
    image: ghcr.io/nayanthanethsara/algotest/backend:latest
    container_name: labyrithm-backend
    privileged: true
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - JUDGE_WORKERS=0
      - TRUSTED_PROXIES=127.0.0.1,172.16.0.0/12
    volumes:
      - /var/local/lib/labyrithm-work:/var/local/lib/labyrithm-work
    networks:
      - labyrithm-net

  nginx:
    image: nginx:1.27-alpine
    container_name: labyrithm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/deploy/api-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/deploy/api-locations.conf:/etc/nginx/api-locations.conf:ro
      - ./backend/deploy/common-locations.conf:/etc/nginx/common-locations.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - labyrithm-net

networks:
  labyrithm-net:
    name: labyrithm-net
    driver: bridge
