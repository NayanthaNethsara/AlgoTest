name: labyrithm-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: labyrithm-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - labyrithm-prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - labyrithm-net

  loki:
    image: grafana/loki:3.0.0
    container_name: labyrithm-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - labyrithm-loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - labyrithm-net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: labyrithm-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - labyrithm-net

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: labyrithm-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - labyrithm-net

  # Runs only where the "local" profile is enabled, so a server-side
  # `docker compose up -d` never starts it. See docs/monitoring.md.
  grafana:
    profiles: ["local"]
    image: grafana/grafana:11.0.0
    container_name: labyrithm-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/labyrithm-overview.json
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - labyrithm-grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - labyrithm-net

volumes:
  labyrithm-prom-data:
    name: labyrithm-prom-data
  labyrithm-loki-data:
    name: labyrithm-loki-data
  labyrithm-grafana-data:
    name: labyrithm-grafana-data

networks:
  labyrithm-net:
    name: labyrithm-net
    driver: bridge
