apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 10s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: ${LOKI_URL}
    isDefault: false
    editable: true
    jsonData:
      maxLines: 2000
