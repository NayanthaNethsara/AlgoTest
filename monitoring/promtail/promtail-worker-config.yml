server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.148.0.2:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          host: worker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
            attrs: attrs
            tag: tag

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - json:
          source: output
          expressions:
            level: level
            msg: msg
            request_id: request_id
            status: status
            error: error

      - labels:
          stream:
          level:
          status:

      - template:
          source: level
          template: '{{ if not .level }}info{{ else }}{{ .level }}{{ end }}'

      - output:
          source: output
