global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "algothon-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["algothon-backend:8080", "host.docker.internal:8080", "localhost:8080"]
        labels:
          app: "mini-algothon"
          service: "backend"
          env: "production"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host-node"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
