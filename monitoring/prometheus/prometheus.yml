global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "labyrithm-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          [
            "labyrithm-backend:8080",
            "host.docker.internal:8080",
            "localhost:8080",
          ]
        labels:
          app: "labyrithm"
          service: "backend"
          env: "production"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host-node"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
