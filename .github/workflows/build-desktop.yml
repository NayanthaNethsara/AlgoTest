name: Build Standalone Proctor Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      portal_url:
        description: 'Portal the client opens, and the only Origin its loopback server answers'
        required: false
      api_url:
        description: 'API base URL the agent reports to. On a LAN with no contestant internet, the relay'
        required: false
      portal_origins:
        description: 'Standby portals the loopback server also answers, comma-separated'
        required: false

jobs:
  build-agent:
    name: Build Agent (${{ matrix.os_name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'macos'
            os_name: 'macOS'
          - platform: 'windows-latest'
            target: 'windows'
            os_name: 'Windows'
          - platform: 'ubuntu-22.04'
            target: 'linux'
            os_name: 'Linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Resolve client addresses
        id: addr
        shell: bash
        env:
          PORTAL: ${{ inputs.portal_url || vars.MINIALGOTHON_SERVER_URL }}
          API: ${{ inputs.api_url || vars.MINIALGOTHON_API_URL }}
        run: |
          if [ -z "$PORTAL" ] || [ -z "$API" ]; then
            echo "::error::Set repository variables MINIALGOTHON_SERVER_URL and MINIALGOTHON_API_URL, or pass them as workflow inputs."
            exit 1
          fi
          echo "portal=$PORTAL" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"

      - name: Build Standalone Agent
        env:
          MINIALGOTHON_SERVER_URL: ${{ steps.addr.outputs.portal }}
          MINIALGOTHON_API_URL: ${{ steps.addr.outputs.api }}
          MINIALGOTHON_PORTAL_ORIGINS: ${{ inputs.portal_origins || vars.MINIALGOTHON_PORTAL_ORIGINS }}
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos" ]; then
            cd competitor-desktop && pnpm run build:agent
          else
            cd competitor-desktop/src-tauri && cargo build --release --bin mini-algothon-agent
          fi

      - name: Prepare Standalone Portable Executables
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/standalone_artifacts"
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp competitor-desktop/src-tauri/target/release/mini-algothon-agent.exe "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-agent-windows-x64.exe"
          elif [ "${{ matrix.target }}" = "macos" ]; then
            if [ -d "competitor-desktop/src-tauri/target/release/bundle/macos/MiniAlgothon Agent.app" ]; then
              cd "competitor-desktop/src-tauri/target/release/bundle/macos"
              zip -r "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-agent-macos.zip" "MiniAlgothon Agent.app"
              cd "$GITHUB_WORKSPACE"
            else
              cp competitor-desktop/src-tauri/target/release/mini-algothon-agent "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-agent-macos"
            fi
          elif [ "${{ matrix.target }}" = "linux" ]; then
            cp competitor-desktop/src-tauri/target/release/mini-algothon-agent "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-agent-linux-x64"
            chmod +x "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-agent-linux-x64"
          fi

      - name: Upload Agent Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mini-algothon-agent-${{ matrix.target }}
          path: standalone_artifacts/*
