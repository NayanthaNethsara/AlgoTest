name: Build Standalone Proctor Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      portal_url:
        description: 'Portal the client opens, and the only Origin its loopback server answers'
        default: 'https://competitor-portal--algothon-2026.asia-southeast1.hosted.app'
        required: false
      api_url:
        description: 'API base URL the agent reports to'
        default: 'https://mini-algothon-api.nayantha.me'
        required: false
      portal_origins:
        description: 'Standby portals the loopback server also answers, comma-separated'
        default: 'https://competitor-portal--algothon-2026.asia-southeast1.hosted.app,http://localhost:3000'
        required: false

jobs:
  build-agent:
    name: Build Agent (${{ matrix.os_name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'macos'
            os_name: 'macOS'
          - platform: 'windows-latest'
            target: 'windows'
            os_name: 'Windows'
          - platform: 'ubuntu-22.04'
            target: 'linux'
            os_name: 'Linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Resolve server and portal URLs
        id: addr
        shell: bash
        env:
          PORTAL: ${{ inputs.portal_url || vars.ALGOTHON_SERVER_URL }}
          API: ${{ inputs.api_url || vars.ALGOTHON_API_URL }}
        run: |
          if [ -z "$PORTAL" ]; then
            PORTAL="https://competitor-portal--algothon-2026.asia-southeast1.hosted.app"
          fi
          if [ -z "$API" ]; then
            API="https://mini-algothon-api.nayantha.me"
          fi
          ORIGINS="${{ inputs.portal_origins || vars.ALGOTHON_PORTAL_ORIGINS }}"
          if [ -z "$ORIGINS" ]; then
            ORIGINS="https://competitor-portal--algothon-2026.asia-southeast1.hosted.app,http://localhost:3000"
          fi
          echo "portal=$PORTAL" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "origins=$ORIGINS" >> "$GITHUB_OUTPUT"

      - name: Build Standalone Agent
        env:
          ALGOTHON_SERVER_URL: ${{ steps.addr.outputs.portal }}
          ALGOTHON_API_URL: ${{ steps.addr.outputs.api }}
          ALGOTHON_PORTAL_ORIGINS: ${{ steps.addr.outputs.origins }}
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos" ]; then
            cd competitor-desktop && pnpm run build:agent
          else
            cd competitor-desktop/src-tauri && cargo build --release --bin algothon-agent
          fi

      - name: Prepare Standalone Portable Executables
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/standalone_artifacts"
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp competitor-desktop/src-tauri/target/release/algothon-agent.exe "$GITHUB_WORKSPACE/standalone_artifacts/algothon-agent-windows-x64.exe"
          elif [ "${{ matrix.target }}" = "macos" ]; then
            if [ -d "competitor-desktop/src-tauri/target/release/bundle/macos/Algothon Agent.app" ]; then
              cd "competitor-desktop/src-tauri/target/release/bundle/macos"
              zip -r -y "$GITHUB_WORKSPACE/standalone_artifacts/algothon-agent-macos.zip" "Algothon Agent.app"
              cd "$GITHUB_WORKSPACE"
            fi
            if [ -f "competitor-desktop/src-tauri/target/release/bundle/macos/Algothon Agent.app/Contents/MacOS/algothon-agent" ]; then
              cp "competitor-desktop/src-tauri/target/release/bundle/macos/Algothon Agent.app/Contents/MacOS/algothon-agent" "$GITHUB_WORKSPACE/standalone_artifacts/algothon-agent-macos-binary"
              chmod +x "$GITHUB_WORKSPACE/standalone_artifacts/algothon-agent-macos-binary"
            elif [ -f "competitor-desktop/src-tauri/target/release/algothon-agent" ]; then
              cp "competitor-desktop/src-tauri/target/release/algothon-agent" "$GITHUB_WORKSPACE/standalone_artifacts/algothon-agent-macos-binary"
              chmod +x "$GITHUB_WORKSPACE/standalone_artifacts/algothon-agent-macos-binary"
            fi
          elif [ "${{ matrix.target }}" = "linux" ]; then
            cp competitor-desktop/src-tauri/target/release/algothon-agent "$GITHUB_WORKSPACE/standalone_artifacts/algothon-agent-linux-x64"
            chmod +x "$GITHUB_WORKSPACE/standalone_artifacts/algothon-agent-linux-x64"
          fi

      - name: Upload Agent Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: algothon-agent-${{ matrix.target }}
          path: standalone_artifacts/*
