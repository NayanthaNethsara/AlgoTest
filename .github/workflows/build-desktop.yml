name: Build Standalone Proctor Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      portal_url:
        description: "Portal the client opens, and the only Origin its loopback server answers"
        required: true
      api_url:
        description: "API base URL the agent reports to"
        required: true
      portal_origins:
        description: "Standby portals the loopback server also answers, comma-separated"
        required: true

jobs:
  build-agent:
    name: Build Agent (${{ matrix.os_name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "macos"
            os_name: "macOS"
          - platform: "windows-latest"
            target: "windows"
            os_name: "Windows"
          - platform: "ubuntu-22.04"
            target: "linux"
            os_name: "Linux"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Resolve server and portal URLs
        id: addr
        shell: bash
        env:
          PORTAL: ${{ inputs.portal_url || vars.LABYRITHM_SERVER_URL }}
          API: ${{ inputs.api_url || vars.LABYRITHM_API_URL }}
        run: |
          if [ -z "$PORTAL" ] || [ -z "$API" ]; then
            echo "portal_url and api_url are required inputs or repository variables" >&2
            exit 1
          fi
          ORIGINS="${{ inputs.portal_origins || vars.LABYRITHM_PORTAL_ORIGINS }}"
          if [ -z "$ORIGINS" ]; then
            echo "portal_origins is required as an input or repository variable" >&2
            exit 1
          fi
          echo "portal=$PORTAL" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "origins=$ORIGINS" >> "$GITHUB_OUTPUT"

      - name: Build Standalone Agent
        env:
          LABYRITHM_SERVER_URL: ${{ steps.addr.outputs.portal }}
          LABYRITHM_API_URL: ${{ steps.addr.outputs.api }}
          LABYRITHM_PORTAL_ORIGINS: ${{ steps.addr.outputs.origins }}
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos" ]; then
            cd competitor-desktop && pnpm run build:agent
          else
            cd competitor-desktop/src-tauri && cargo build --release --bin labyrithm-agent
          fi

      - name: Prepare Standalone Portable Executables
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/standalone_artifacts"
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp competitor-desktop/src-tauri/target/release/labyrithm-agent.exe "$GITHUB_WORKSPACE/standalone_artifacts/labyrithm-agent-windows-x64.exe"
          elif [ "${{ matrix.target }}" = "macos" ]; then
            if [ -d "competitor-desktop/src-tauri/target/release/bundle/macos/Labyrithm Agent.app" ]; then
              cd "competitor-desktop/src-tauri/target/release/bundle/macos"
              zip -r -y "$GITHUB_WORKSPACE/standalone_artifacts/labyrithm-agent-macos.zip" "Labyrithm Agent.app"
              cd "$GITHUB_WORKSPACE"
            fi
            if [ -f "competitor-desktop/src-tauri/target/release/bundle/macos/Labyrithm Agent.app/Contents/MacOS/labyrithm-agent" ]; then
              cp "competitor-desktop/src-tauri/target/release/bundle/macos/Labyrithm Agent.app/Contents/MacOS/labyrithm-agent" "$GITHUB_WORKSPACE/standalone_artifacts/labyrithm-agent-macos-binary"
              chmod +x "$GITHUB_WORKSPACE/standalone_artifacts/labyrithm-agent-macos-binary"
            elif [ -f "competitor-desktop/src-tauri/target/release/labyrithm-agent" ]; then
              cp "competitor-desktop/src-tauri/target/release/labyrithm-agent" "$GITHUB_WORKSPACE/standalone_artifacts/labyrithm-agent-macos-binary"
              chmod +x "$GITHUB_WORKSPACE/standalone_artifacts/labyrithm-agent-macos-binary"
            fi
          elif [ "${{ matrix.target }}" = "linux" ]; then
            cp competitor-desktop/src-tauri/target/release/labyrithm-agent "$GITHUB_WORKSPACE/standalone_artifacts/labyrithm-agent-linux-x64"
            chmod +x "$GITHUB_WORKSPACE/standalone_artifacts/labyrithm-agent-linux-x64"
          fi

      - name: Upload Agent Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labyrithm-agent-${{ matrix.target }}
          path: standalone_artifacts/*
