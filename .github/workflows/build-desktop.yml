name: Build Desktop Release Applications

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      portal_url:
        description: 'Portal the client opens, and the only Origin its loopback server answers'
        required: false
      api_url:
        description: 'API base URL the agent reports to. On a LAN with no contestant internet, the relay'
        required: false
      portal_origins:
        description: 'Standby portals the loopback server also answers, comma-separated'
        required: false

jobs:
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'macos'
            os_name: 'macOS'
          - platform: 'windows-latest'
            target: 'windows'
            os_name: 'Windows'
          - platform: 'ubuntu-22.04'
            target: 'linux'
            os_name: 'Linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      # Baked in, not left to the setup form: the address a contestant types becomes
      # the only Origin the loopback server answers, so one typo costs them
      # attestation and blames an agent that is running perfectly. A saved
      # client.json still overrides these.
      #
      # Empty is worse than absent -- option_env! returns Some("") for a set-but-empty
      # variable -- so fail here rather than publish installers pointing nowhere.
      - name: Resolve client addresses
        id: addr
        shell: bash
        env:
          PORTAL: ${{ inputs.portal_url || vars.MINIALGOTHON_SERVER_URL }}
          API: ${{ inputs.api_url || vars.MINIALGOTHON_API_URL }}
        run: |
          if [ -z "$PORTAL" ] || [ -z "$API" ]; then
            echo "::error::Set repository variables MINIALGOTHON_SERVER_URL and MINIALGOTHON_API_URL, or pass them as workflow inputs. Without them every installer points at localhost."
            exit 1
          fi
          echo "portal=$PORTAL" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"

      - name: Build Desktop Application & Standalone Agent
        env:
          MINIALGOTHON_SERVER_URL: ${{ steps.addr.outputs.portal }}
          MINIALGOTHON_API_URL: ${{ steps.addr.outputs.api }}
          MINIALGOTHON_PORTAL_ORIGINS: ${{ inputs.portal_origins || vars.MINIALGOTHON_PORTAL_ORIGINS }}
        run: |
          make desktop-build
          make agent-build

      - name: Prepare Standalone Portable Executables
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/standalone_artifacts"
          if [ "${{ matrix.target }}" = "windows" ]; then
            # Kiosk App & Standalone Agent .exe
            cp competitor-desktop/src-tauri/target/release/mini-algothon-competitor.exe "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-competitor-windows-standalone-x64.exe" 2>/dev/null || true
            cp competitor-desktop/src-tauri/target/release/mini-algothon-agent.exe "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-agent-windows-standalone-x64.exe" 2>/dev/null || true
          elif [ "${{ matrix.target }}" = "macos" ]; then
            # Kiosk App bundle & Standalone Agent binary
            if [ -d "competitor-desktop/src-tauri/target/release/bundle/macos/mini-algothon-competitor.app" ]; then
              cp -R "competitor-desktop/src-tauri/target/release/bundle/macos/mini-algothon-competitor.app" "$GITHUB_WORKSPACE/standalone_artifacts/"
            else
              cp competitor-desktop/src-tauri/target/release/mini-algothon-competitor "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-competitor-macos-binary" 2>/dev/null || true
            fi
            cp competitor-desktop/src-tauri/target/release/mini-algothon-agent "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-agent-macos-binary" 2>/dev/null || true
          elif [ "${{ matrix.target }}" = "linux" ]; then
            # Kiosk App & Standalone Agent Linux binaries
            cp competitor-desktop/src-tauri/target/release/mini-algothon-competitor "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-competitor-linux-standalone-amd64" 2>/dev/null || true
            chmod +x "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-competitor-linux-standalone-amd64" 2>/dev/null || true
            cp competitor-desktop/src-tauri/target/release/mini-algothon-agent "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-agent-linux-standalone-amd64" 2>/dev/null || true
            chmod +x "$GITHUB_WORKSPACE/standalone_artifacts/mini-algothon-agent-linux-standalone-amd64" 2>/dev/null || true
          fi

      - name: Upload Desktop & Agent Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: mini-algothon-artifacts-${{ matrix.target }}
          path: standalone_artifacts
