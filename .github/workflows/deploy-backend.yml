name: Deploy Backend to VM (Manual GHCR)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch, Tag, or Commit SHA to deploy'
        required: true
        default: 'dev/v1-beta'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        working-directory: backend
        run: go test ./internal/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Image Name
        id: image
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}/backend" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_LOWER" >> $GITHUB_ENV

      - name: Derive Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull & Deploy via Docker Compose
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Secrets, not variables: Actions logs are public on this repo, and
      # GitHub masks secret values wherever gcloud echoes them back.
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      # Inert without the project ID, so left readable.
      GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
      GCE_ZONE: ${{ vars.GCE_ZONE }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Verify deploy config is present
        run: |
          for VAR in GCP_PROJECT GCE_INSTANCE GCE_ZONE DEPLOY_USER DEPLOY_DIR; do
            if [ -z "${!VAR}" ]; then
              echo "::error::$VAR is empty -- set it in Settings > Secrets and variables > Actions"
              exit 1
            fi
          done

      - name: Compose remote deploy script
        env:
          GIT_REF: ${{ github.event.inputs.git_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          # Values are injected as quoted assignments rather than interpolated
          # into the script body, so a crafted ref cannot break out into code.
          {
            printf 'export GIT_REF=%q\n' "$GIT_REF"
            printf 'export GHCR_USER=%q\n' "$GHCR_USER"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'export GHCR_IMAGE=%q\n' "$(echo "$REPO_SLUG/backend" | tr '[:upper:]' '[:lower:]')"
            printf 'export DEPLOY_DIR=%q\n' "$DEPLOY_DIR"
            cat <<'REMOTE'
          set -euo pipefail

          echo "==> Navigating to project directory"
          cd "$DEPLOY_DIR"

          echo "==> Syncing branch: $GIT_REF"
          git fetch --all
          git checkout "$GIT_REF"
          git pull origin "$GIT_REF"

          echo "==> Logging into GHCR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          echo "==> Pulling latest backend image"
          docker compose -f docker-compose.prod.yml pull backend

          echo "==> Starting / Updating services with Docker Compose"
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "==> Reloading Nginx with updated configurations"
          docker compose -f docker-compose.prod.yml restart nginx || docker exec algothon-nginx nginx -s reload || true

          echo "==> Starting / Updating Monitoring stack (Prometheus, Loki, Promtail, Node Exporter)"
          # Grafana is behind the "local" profile and deliberately not started here.
          docker compose -f monitoring/docker-compose.monitoring.yml up -d

          echo "==> Cleaning up dangling old images"
          docker image prune -f

          echo "==> Production Services Status:"
          docker compose -f docker-compose.prod.yml ps

          echo "==> Monitoring Services Status:"
          docker compose -f monitoring/docker-compose.monitoring.yml ps
          REMOTE
          } > "$RUNNER_TEMP/deploy.sh"

      - name: Deploy over IAP tunnel
        run: |
          gcloud compute ssh "$GCE_INSTANCE" \
            --zone="$GCE_ZONE" \
            --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --quiet \
            --ssh-key-expire-after=10m \
            --command="sudo -u $DEPLOY_USER -H bash -s" < "$RUNNER_TEMP/deploy.sh"
