name: Deploy Backend to VM (Manual GHCR)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch, Tag, or Commit SHA to deploy'
        required: true
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push:
    name: Build & Push Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        working-directory: backend
        run: go test ./internal/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull & Deploy via Docker Compose
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VM and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            echo "==> Navigating to project directory"
            cd ~/mini-algothon

            echo "==> Syncing compose configuration"
            git fetch origin main
            git checkout origin/main -- docker-compose.prod.yml backend/deploy/

            echo "==> Logging into GHCR"
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true

            echo "==> Pulling latest backend image"
            GHCR_IMAGE="${{ env.IMAGE_NAME }}" docker compose -f docker-compose.prod.yml pull backend

            echo "==> Starting / Updating services with Docker Compose"
            GHCR_IMAGE="${{ env.IMAGE_NAME }}" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Service Status:"
            docker compose -f docker-compose.prod.yml ps
