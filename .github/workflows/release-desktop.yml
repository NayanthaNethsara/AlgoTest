name: Release Desktop Applications

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.0)'
        required: false
      release_name:
        description: 'Release Title'
        required: false
      portal_url:
        description: 'Portal URL (e.g. http://contest.venue.local)'
        required: false
      api_url:
        description: 'API base URL (e.g. http://api.venue.local:8080)'
        required: false
      portal_origins:
        description: 'Standby portal origins, comma-separated'
        required: false
      draft:
        description: 'Publish as a draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'macos'
            os_name: 'macOS'
          - platform: 'windows-latest'
            target: 'windows'
            os_name: 'Windows'
          - platform: 'ubuntu-22.04'
            target: 'linux'
            os_name: 'Linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Resolve server and portal URLs
        id: addr
        shell: bash
        env:
          PORTAL: ${{ inputs.portal_url || vars.MINIALGOTHON_SERVER_URL }}
          API: ${{ inputs.api_url || vars.MINIALGOTHON_API_URL }}
        run: |
          if [ -z "$PORTAL" ] || [ -z "$API" ]; then
            echo "::warning::MINIALGOTHON_SERVER_URL or MINIALGOTHON_API_URL not specified. Using defaults."
          fi
          echo "portal=$PORTAL" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"

      - name: Build Desktop Application
        env:
          MINIALGOTHON_SERVER_URL: ${{ steps.addr.outputs.portal }}
          MINIALGOTHON_API_URL: ${{ steps.addr.outputs.api }}
          MINIALGOTHON_PORTAL_ORIGINS: ${{ inputs.portal_origins || vars.MINIALGOTHON_PORTAL_ORIGINS }}
        run: make desktop-build

      - name: Collect Release Assets
        shell: bash
        run: |
          mkdir -p release_assets
          if [ "${{ matrix.target }}" = "windows" ]; then
            # Standalone Portable Executable (No installation required)
            cp competitor-desktop/src-tauri/target/release/mini-algothon-competitor.exe release_assets/mini-algothon-competitor-windows-standalone-x64.exe 2>/dev/null || \
            cp competitor-desktop/src-tauri/target/release/app.exe release_assets/mini-algothon-competitor-windows-standalone-x64.exe 2>/dev/null || true
            
            # NSIS Installer (if generated)
            cp competitor-desktop/src-tauri/target/release/bundle/nsis/*.exe release_assets/mini-algothon-competitor-windows-installer-x64.exe 2>/dev/null || true
          elif [ "${{ matrix.target }}" = "macos" ]; then
            # DMG image
            cp competitor-desktop/src-tauri/target/release/bundle/dmg/*.dmg release_assets/ 2>/dev/null || true
            
            # Zipped .app bundle
            if [ -d "competitor-desktop/src-tauri/target/release/bundle/macos/mini-algothon-competitor.app" ]; then
              cd competitor-desktop/src-tauri/target/release/bundle/macos
              zip -r ../../../../../release_assets/mini-algothon-competitor-macos-app.zip mini-algothon-competitor.app
              cd -
            fi
          elif [ "${{ matrix.target }}" = "linux" ]; then
            # Debian package
            cp competitor-desktop/src-tauri/target/release/bundle/deb/*.deb release_assets/ 2>/dev/null || true
            
            # Standalone binary
            cp competitor-desktop/src-tauri/target/release/mini-algothon-competitor release_assets/mini-algothon-competitor-linux-standalone-amd64 2>/dev/null || \
            cp competitor-desktop/src-tauri/target/release/app release_assets/mini-algothon-competitor-linux-standalone-amd64 2>/dev/null || true
            chmod +x release_assets/mini-algothon-competitor-linux-standalone-amd64 2>/dev/null || true
          fi

      - name: Upload Platform Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release_assets/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          path: all_release_assets
          pattern: release-*
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.2.0-$(date +'%Y%m%d%H%M')"
          fi
          
          if [ -n "${{ inputs.release_name }}" ]; then
            TITLE="${{ inputs.release_name }}"
          else
            TITLE="MiniAlgothon Competitor Client $TAG"
          fi
          
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          artifacts: 'all_release_assets/*'
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          generateReleaseNotes: true
