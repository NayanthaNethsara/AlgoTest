name: Release Standalone Proctor Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.2)'
        required: false
      release_name:
        description: 'Release title'
        required: false
      portal_url:
        description: 'Portal URL'
        required: true
      api_url:
        description: 'API base URL'
        required: true
      portal_origins:
        description: 'Standby portal origins, comma-separated'
        required: true
      draft:
        description: 'Publish as a draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Agent (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'macos'
            os_name: 'macOS'
          - platform: 'windows-latest'
            target: 'windows'
            os_name: 'Windows'
          - platform: 'ubuntu-22.04'
            target: 'linux'
            os_name: 'Linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Resolve server and portal URLs
        id: addr
        shell: bash
        env:
          PORTAL: ${{ inputs.portal_url || vars.LABYRITHM_SERVER_URL }}
          API: ${{ inputs.api_url || vars.LABYRITHM_API_URL }}
        run: |
          if [ -z "$PORTAL" ] || [ -z "$API" ]; then
            echo "portal_url and api_url are required inputs or repository variables" >&2
            exit 1
          fi
          ORIGINS="${{ inputs.portal_origins || vars.LABYRITHM_PORTAL_ORIGINS }}"
          if [ -z "$ORIGINS" ]; then
            echo "portal_origins is required as an input or repository variable" >&2
            exit 1
          fi
          echo "portal=$PORTAL" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "origins=$ORIGINS" >> "$GITHUB_OUTPUT"

      - name: Build Standalone Agent
        env:
          LABYRITHM_SERVER_URL: ${{ steps.addr.outputs.portal }}
          LABYRITHM_API_URL: ${{ steps.addr.outputs.api }}
          LABYRITHM_PORTAL_ORIGINS: ${{ steps.addr.outputs.origins }}
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos" ]; then
            cd competitor-desktop && pnpm run build:agent
          else
            cd competitor-desktop/src-tauri && cargo build --release --bin labyrithm-agent
          fi

      - name: Collect Release Assets
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_assets"
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp competitor-desktop/src-tauri/target/release/labyrithm-agent.exe "$GITHUB_WORKSPACE/release_assets/labyrithm-agent-windows-x64.exe"
          elif [ "${{ matrix.target }}" = "macos" ]; then
            if [ -d "competitor-desktop/src-tauri/target/release/bundle/macos/Labyrithm Agent.app" ]; then
              cd "competitor-desktop/src-tauri/target/release/bundle/macos"
              zip -r -y "$GITHUB_WORKSPACE/release_assets/labyrithm-agent-macos.zip" "Labyrithm Agent.app"
              cd "$GITHUB_WORKSPACE"
            fi
            if [ -f "competitor-desktop/src-tauri/target/release/bundle/macos/Labyrithm Agent.app/Contents/MacOS/labyrithm-agent" ]; then
              cp "competitor-desktop/src-tauri/target/release/bundle/macos/Labyrithm Agent.app/Contents/MacOS/labyrithm-agent" "$GITHUB_WORKSPACE/release_assets/labyrithm-agent-macos-binary"
              chmod +x "$GITHUB_WORKSPACE/release_assets/labyrithm-agent-macos-binary"
            elif [ -f "competitor-desktop/src-tauri/target/release/labyrithm-agent" ]; then
              cp "competitor-desktop/src-tauri/target/release/labyrithm-agent" "$GITHUB_WORKSPACE/release_assets/labyrithm-agent-macos-binary"
              chmod +x "$GITHUB_WORKSPACE/release_assets/labyrithm-agent-macos-binary"
            fi
          elif [ "${{ matrix.target }}" = "linux" ]; then
            cp competitor-desktop/src-tauri/target/release/labyrithm-agent "$GITHUB_WORKSPACE/release_assets/labyrithm-agent-linux-x64"
            chmod +x "$GITHUB_WORKSPACE/release_assets/labyrithm-agent-linux-x64"
          fi

      - name: Upload Platform Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release_assets/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          path: all_release_assets
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          cd all_release_assets
          sha256sum labyrithm-agent-* > checksums.txt 2>/dev/null || shasum -a 256 labyrithm-agent-* > checksums.txt
          echo "### Release Binary Checksums (SHA-256)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat checksums.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Copy these hashes into the Admin Console to enforce binary validation." >> $GITHUB_STEP_SUMMARY

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.2.0-$(date +'%Y%m%d%H%M')"
          fi
          
          if [ -n "${{ inputs.release_name }}" ]; then
            TITLE="${{ inputs.release_name }}"
          else
            TITLE="Labyrithm Proctor Agent $TAG"
          fi
          
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          artifacts: 'all_release_assets/*'
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          generateReleaseNotes: true
